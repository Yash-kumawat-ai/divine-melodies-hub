<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Light Devanagari weights — non-render-blocking with display=swap -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Inter:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Inter:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Raghavam - Indian Bhajans & Devotional Songs</title>
    <meta name="description" content="Discover and share Hindu devotional songs (bhajans). Find lyrics, mantras, stotrams for Krishna, Shiva, Hanuman, Rama, and more deities." />
    <meta name="author" content="Raghavam" />
    <link rel="icon" type="image/png" href="/mandala-logo.png" />
    <!-- Splash logo: standard priority (not the true LCP element) -->
    <link rel="preload" href="/raghavam-logo.webp" as="image" type="image/webp" />
    <!-- Responsive LCP Hero Image Preloads: Scanner-discoverable -->
    <link
      rel="preload"
      href="/hero-lcp-mobile.webp"
      as="image"
      type="image/webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/hero-lcp-desktop.webp"
      as="image"
      type="image/webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <meta property="og:title" content="Raghavam - Indian Bhajans" />
    <meta property="og:description" content="Discover and share Hindu devotional songs. Find lyrics for Krishna, Shiva, Hanuman and more." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/mandala-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raghavam" />
    <meta name="twitter:description" content="Discover and share Hindu devotional songs" />
    <meta name="twitter:image" content="/mandala-logo.png" />
  </head>
  <body>
    <!-- Premium Divine Reference Splash Screen Loader -->
    <div id="loading-splash" aria-hidden="true" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; background-color: #FBF6EE; overflow: hidden; pointer-events: none; padding: 20px 16px; font-family: 'Cinzel', 'Noto Serif Devanagari', 'Martel', Georgia, serif;">
      
      <!-- Subtle Corner Mandalas (Watermarks) -->
      <svg class="corner-mandala corner-tl" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="0" cy="0" r="140" fill="none" stroke="#C69A59" stroke-width="0.8" opacity="0.18" stroke-dasharray="3,3" />
        <circle cx="0" cy="0" r="100" fill="none" stroke="#651317" stroke-width="0.8" opacity="0.14" />
        <circle cx="0" cy="0" r="60" fill="none" stroke="#C69A59" stroke-width="0.8" opacity="0.2" />
      </svg>
      <svg class="corner-mandala corner-tr" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="200" cy="0" r="140" fill="none" stroke="#C69A59" stroke-width="0.8" opacity="0.18" stroke-dasharray="3,3" />
        <circle cx="200" cy="0" r="100" fill="none" stroke="#651317" stroke-width="0.8" opacity="0.14" />
        <circle cx="200" cy="0" r="60" fill="none" stroke="#C69A59" stroke-width="0.8" opacity="0.2" />
      </svg>
      <svg class="corner-mandala corner-bl" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="0" cy="200" r="140" fill="none" stroke="#C69A59" stroke-width="0.8" opacity="0.18" stroke-dasharray="3,3" />
        <circle cx="0" cy="200" r="100" fill="none" stroke="#651317" stroke-width="0.8" opacity="0.14" />
        <circle cx="0" cy="200" r="60" fill="none" stroke="#C69A59" stroke-width="0.8" opacity="0.2" />
      </svg>
      <svg class="corner-mandala corner-br" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="200" cy="200" r="140" fill="none" stroke="#C69A59" stroke-width="0.8" opacity="0.18" stroke-dasharray="3,3" />
        <circle cx="200" cy="200" r="100" fill="none" stroke="#651317" stroke-width="0.8" opacity="0.14" />
        <circle cx="200" cy="200" r="60" fill="none" stroke="#C69A59" stroke-width="0.8" opacity="0.2" />
      </svg>

      <!-- Flowing Gold Wave Background Lines -->
      <svg class="wave-bg" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
        <path d="M-100,280 C250,220 350,420 1100,320 M-100,310 C270,250 370,450 1100,350 M-100,340 C290,280 390,480 1100,380" fill="none" stroke="#D4AF37" stroke-width="0.65" opacity="0.14" />
      </svg>

      <!-- CONTINUOUS VERTICAL SHAFT OF DIVINE LIGHT (Top Edge to Bottom Edge) -->
      <div class="divine-light-shaft-outer"></div>
      <div class="divine-light-shaft-core"></div>
      <div class="divine-light-center-bloom"></div>

      <!-- MAIN CENTERED CONTENT CONTAINER -->
      <div class="splash-center-content">
        <!-- Raghavam Official Mandala Logo -->
        <div class="logo-wrapper">
          <img
            src="/raghavam-logo.webp"
            alt="Raghavam"
            width="240"
            height="240"
            class="raghavam-mandala-logo"
            fetchpriority="high"
            decoding="sync"
          />
        </div>

        <!-- Sacred Sanskrit Shloka -->
        <div class="sacred-shloka">
          <span class="shloka-line-1">भगवत् स्मरणं,</span>
          <span class="shloka-line-2">जीवन पावनम्</span>
        </div>

        <!-- Golden Diamond Ornament Divider -->
        <div class="ornament-divider">
          <div class="ornament-line"></div>
          <div class="ornament-diamond"></div>
          <div class="ornament-line"></div>
        </div>

        <!-- Animated 3-Dot Wave Indicator -->
        <div class="splash-loading-dots" aria-label="Loading">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <style>
        #loading-splash {
          background-color: #FBF6EE;
          color: #5C1D18;
          transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
          will-change: opacity, transform;
        }

        #loading-splash.splash-fade-out {
          opacity: 0 !important;
          transform: scale(1.02);
          pointer-events: none;
        }

        .corner-mandala {
          position: absolute;
          width: min(200px, 42vw);
          height: min(200px, 42vw);
          pointer-events: none;
          z-index: 1;
        }
        .corner-tl { top: -20px; left: -20px; }
        .corner-tr { top: -20px; right: -20px; }
        .corner-bl { bottom: -20px; left: -20px; }
        .corner-br { bottom: -20px; right: -20px; }

        .wave-bg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 1;
        }

        /* ================= CONTINUOUS VERTICAL SHAFT OF LIGHT ================= */
        .divine-light-shaft-outer {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 50%;
          width: min(160px, 42vw);
          transform: translate3d(-50%, 0, 0);
          background: linear-gradient(
            90deg,
            rgba(218, 165, 32, 0) 0%,
            rgba(245, 193, 92, 0.06) 15%,
            rgba(245, 193, 92, 0.18) 35%,
            rgba(255, 235, 165, 0.45) 50%,
            rgba(245, 193, 92, 0.18) 65%,
            rgba(245, 193, 92, 0.06) 85%,
            rgba(218, 165, 32, 0) 100%
          );
          pointer-events: none;
          z-index: 2;
          animation: shaft-radiance-pulse 3s ease-in-out infinite;
        }

        .divine-light-shaft-core {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 50%;
          width: min(28px, 7vw);
          transform: translate3d(-50%, 0, 0);
          background: linear-gradient(
            90deg,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 245, 200, 0.3) 20%,
            rgba(255, 255, 255, 0.85) 50%,
            rgba(255, 245, 200, 0.3) 80%,
            rgba(255, 255, 255, 0) 100%
          );
          pointer-events: none;
          z-index: 3;
          animation: shaft-core-pulse 3s ease-in-out infinite;
        }

        .divine-light-center-bloom {
          position: absolute;
          top: 36%;
          left: 50%;
          width: min(400px, 88vw);
          height: min(400px, 88vw);
          transform: translate3d(-50%, -50%, 0);
          border-radius: 50%;
          background: radial-gradient(
            circle at center,
            rgba(255, 240, 180, 0.55) 0%,
            rgba(255, 230, 150, 0.35) 25%,
            rgba(245, 193, 92, 0.18) 48%,
            rgba(245, 193, 92, 0.06) 68%,
            rgba(251, 246, 238, 0) 85%
          );
          pointer-events: none;
          z-index: 4;
          animation: bloom-breathing 3s ease-in-out infinite;
        }

        @keyframes shaft-radiance-pulse {
          0%, 100% { opacity: 0.78; }
          50% { opacity: 1; }
        }

        @keyframes shaft-core-pulse {
          0%, 100% { opacity: 0.85; }
          50% { opacity: 1; }
        }

        @keyframes bloom-breathing {
          0%, 100% { opacity: 0.80; }
          50% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
          .divine-light-shaft-outer,
          .divine-light-shaft-core,
          .divine-light-center-bloom,
          .splash-loading-dots span {
            animation: none !important;
          }
        }

        /* ================= CENTER CONTENT ================= */
        .splash-center-content {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          max-width: 520px;
          width: 100%;
          margin: auto;
        }

        .logo-wrapper {
          margin-bottom: clamp(14px, 2.5vh, 22px);
        }

        .raghavam-mandala-logo {
          width: clamp(170px, min(48vw, 230px), 240px);
          height: auto;
          display: block;
          filter: drop-shadow(0 6px 20px rgba(100, 18, 16, 0.10));
        }

        .sacred-shloka {
          display: flex;
          flex-direction: column;
          align-items: center;
          color: #651317;
          font-weight: 700;
          font-size: clamp(20px, min(5vw, 25px), 26px);
          line-height: 1.35;
          letter-spacing: 0.02em;
          margin-bottom: clamp(12px, 2.2vh, 18px);
        }

        .ornament-divider {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          width: min(220px, 60vw);
          margin-bottom: clamp(12px, 2vh, 18px);
        }

        .ornament-line {
          flex: 1;
          height: 1px;
          background: linear-gradient(90deg, transparent, #C69A59, transparent);
        }

        .ornament-diamond {
          width: 9px;
          height: 9px;
          background: #C69A59;
          transform: rotate(45deg);
          border-radius: 1px;
          box-shadow: 0 0 6px rgba(198, 154, 89, 0.4);
        }

        /* ================= ANIMATED 3-DOT WAVE ================= */
        .splash-loading-dots {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          margin-top: clamp(24px, 5vh, 46px);
          margin-bottom: 0;
        }

        .splash-loading-dots span {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #C69A59;
          display: inline-block;
          will-change: transform, opacity;
          animation: splash-dot-pulse 1.4s ease-in-out infinite both;
        }

        .splash-loading-dots span:nth-child(1) {
          animation-delay: 0s;
        }
        .splash-loading-dots span:nth-child(2) {
          animation-delay: 0.22s;
        }
        .splash-loading-dots span:nth-child(3) {
          animation-delay: 0.44s;
        }

        @keyframes splash-dot-pulse {
          0%, 80%, 100% {
            transform: scale(0.72);
            opacity: 0.35;
            background: #C69A59;
            box-shadow: none;
          }
          40% {
            transform: scale(1.35);
            opacity: 1;
            background: #B87B22;
            box-shadow: 0 0 10px rgba(184, 123, 34, 0.75);
          }
        }
      </style>
    </div>

    <!-- React Root Application Container -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
