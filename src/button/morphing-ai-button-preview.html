<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ask AI Button</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .stage { position: relative; display: flex; align-items: center; justify-content: center; }

  .ambient-glow {
    position: absolute;
    width: 320px; height: 320px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(99,102,241,0.25), rgba(168,85,247,0.15) 40%, transparent 70%);
    filter: blur(60px);
    z-index: -1;
    pointer-events: none;
  }

  /* ---- Morph container: animates width/border-radius between pill and circle ---- */
  .morph {
    position: relative;
    height: 56px;
    width: 132px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 22px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    background: linear-gradient(90deg, rgba(37,99,235,0.4), rgba(147,51,234,0.4), rgba(37,99,235,0.4));
    backdrop-filter: blur(10px);
    box-shadow:
      0 8px 24px rgba(30,58,138,0.5),
      inset 0 1px 1px rgba(255,255,255,0.08),
      inset 0 -1px 6px rgba(255,255,255,0.04);
    transition:
      width 0.55s cubic-bezier(0.34, 1.4, 0.4, 1),
      padding 0.55s cubic-bezier(0.34, 1.4, 0.4, 1),
      background 0.5s ease,
      box-shadow 0.5s ease;
  }

  .morph.listening {
    width: 56px;
    padding: 0;
    justify-content: center;
    background: linear-gradient(90deg, rgba(37,99,235,0.5), rgba(147,51,234,0.5), rgba(219,39,119,0.5));
    border-color: rgba(255,255,255,0.2);
    animation: listenGlow 2s ease-in-out infinite;
  }

  @keyframes listenGlow {
    0%   { box-shadow: 0 0 20px rgba(59,130,246,0.5); }
    50%  { box-shadow: 0 0 40px rgba(168,85,247,0.5); }
    100% { box-shadow: 0 0 20px rgba(236,72,153,0.5); }
  }

  /* Shimmer sweep (idle only) */
  .shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,0.14) 50%, transparent 60%);
    transform: translateX(-120%);
    animation: shimmer 3s ease-in-out infinite;
    animation-delay: 1s;
    pointer-events: none;
  }
  @keyframes shimmer {
    0% { transform: translateX(-120%); }
    30% { transform: translateX(120%); }
    100% { transform: translateX(120%); }
  }

  /* Mic icon (idle) */
  .mic-wrap {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px;
    animation: micBreathe 2s ease-in-out infinite;
  }
  @keyframes micBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .mic-glow {
    position: absolute; inset: -8px;
    border-radius: 999px;
    background: rgba(96,165,250,0.35);
    filter: blur(6px);
    animation: micGlow 2s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes micGlow {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.3); opacity: 0.2; }
  }
  .mic-wrap svg { color: rgba(255,255,255,0.85); }

  .label {
    font-size: 14px; font-weight: 500; letter-spacing: 0.03em;
    color: rgba(255,255,255,0.9);
    white-space: nowrap;
    animation: labelPulse 3s ease-in-out infinite;
  }
  @keyframes labelPulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }

  .idle-content, .listening-content {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.3s ease;
  }
  .idle-content { justify-content: space-between; padding: 0 22px; }
  .listening-content { opacity: 0; pointer-events: none; }
  .morph.listening .listening-content { opacity: 1; pointer-events: auto; }
  .morph.listening .idle-content { opacity: 0; pointer-events: none; }

  /* Listening state internals */
  .ripple {
    position: absolute; inset: 0;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.3);
    animation: rippleOut 1.5s ease-out infinite;
  }
  @keyframes rippleOut {
    0% { transform: scale(1); opacity: 1; }
    70% { transform: scale(1.8); opacity: 0.25; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .bars { display: flex; align-items: center; gap: 3px; height: 20px; }
  .bar {
    width: 3px; border-radius: 999px;
    background: linear-gradient(to top, #93c5fd, #ffffff);
    animation: bar 0.6s ease-in-out infinite;
  }
  .bar:nth-child(1) { animation-delay: 0s; }
  .bar:nth-child(2) { animation-delay: 0.15s; }
  .bar:nth-child(3) { animation-delay: 0.30s; }
  @keyframes bar {
    0%, 100% { height: 8px; }
    50% { height: 20px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="ambient-glow"></div>

    <div class="morph" id="morphBtn">
      <div class="shimmer"></div>

      <div class="idle-content">
        <div class="mic-wrap">
          <div class="mic-glow"></div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"/>
          </svg>
        </div>
        <span class="label">Ask AI</span>
      </div>

      <div class="listening-content">
        <div class="ripple"></div>
        <div class="bars">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const morphBtn = document.getElementById('morphBtn');
  let state = 'idle';

  // How long each state stays visible before auto-advancing (ms)
  const DURATIONS = { idle: 2500, listening: 2000 };
  const NEXT = { idle: 'listening', listening: 'idle' };

  function render() {
    morphBtn.classList.toggle('listening', state === 'listening');
  }

  function scheduleNext() {
    setTimeout(() => {
      state = NEXT[state];
      render();
      scheduleNext();
    }, DURATIONS[state]);
  }

  // Auto-play loop starts the moment the page loads — no click needed
  render();
  scheduleNext();
</script>
</body>
</html>
